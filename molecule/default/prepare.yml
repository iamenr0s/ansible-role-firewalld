---

- name: Prepare
  hosts: all
  gather_facts: false
  become: false

  tasks:
    - name: Ensure /tmp exists (raw)
      ansible.builtin.raw: >
        bash -lc 'mkdir -p /tmp && chmod 0777 /tmp'
      changed_when: false

    - name: Install Python 3 (raw, cross-platform)
      ansible.builtin.raw: >
        bash -lc '
        if command -v dnf >/dev/null 2>&1; then
          dnf -y install python3 || dnf -y install python39;
        elif command -v yum >/dev/null 2>&1; then
          yum -y install python3 || yum -y install python36;
        elif command -v apt-get >/dev/null 2>&1; then
          apt-get update -y && apt-get install -y python3;
        elif command -v apk >/dev/null 2>&1; then
          apk add --no-cache python3;
        fi'
      changed_when: true

    - name: Reset connection to use installed Python
      ansible.builtin.meta: reset_connection

    - name: Gather facts now that Python is available
      ansible.builtin.setup:

    - name: Update apt cache on Debian/Ubuntu when apt is available
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
      when: ansible_facts['os_family'] == "Debian" and (ansible_facts['pkg_mgr'] is defined) and (ansible_facts['pkg_mgr'] | default('unknown')) != 'unknown'

    - name: Install procps-ng package (RHEL/Fedora/AlmaLinux)
      ansible.builtin.package:
        name: procps-ng
        state: present
      when: ansible_facts['os_family'] == "RedHat" and (ansible_facts['pkg_mgr'] is defined) and (ansible_facts['pkg_mgr'] | default('unknown')) != 'unknown'

    - name: Install procps package (Debian/Ubuntu)
      ansible.builtin.package:
        name: procps
        state: present
      when: ansible_facts['os_family'] == "Debian" and (ansible_facts['pkg_mgr'] is defined) and (ansible_facts['pkg_mgr'] | default('unknown')) != 'unknown'

    - name: Install python3-rpm package (RHEL/Fedora/AlmaLinux)
      ansible.builtin.package:
        name: python3-rpm
        state: present
      when: ansible_facts['os_family'] == "RedHat" and (ansible_facts['pkg_mgr'] is defined) and (ansible_facts['pkg_mgr'] | default('unknown')) != 'unknown'

    # The container images ship dbus.socket disabled (preset symlinks are
    # stripped at image build). Fedora 44's firewalld.service dropped
    # Requires=dbus.service/Type=dbus in favour of PartOf=dbus.service, so
    # starting firewalld no longer pulls dbus up, and when the broker exits
    # the socket vanishes and firewalld is stopped with it. Enabling the
    # socket restores normal socket activation: the socket path persists and
    # any client connection re-starts the broker.
    - name: Ensure dbus.socket is enabled and active
      ansible.builtin.systemd_service:
        name: dbus.socket
        enabled: true
        state: started
      # Debian/Ubuntu images don't ship dbus at prepare time
      when: ansible_facts['service_mgr'] == 'systemd' and ansible_facts['os_family'] == 'RedHat'
